name: Deploy production Docs
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      preview-only:
        description: Preview the pinned release before its publishing approval
        required: true
        type: boolean
      commit:
        description: Accepted source commit
        required: true
        type: string
      image:
        description: Accepted immutable image
        required: true
        type: string
      core-version:
        description: Advertised Core version
        required: true
        type: string
      cli-version:
        description: Advertised CLI version
        required: true
        type: string
      promote-docs:
        description: Whether this release includes a Docs deployment
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  # Manual deployments own the delivery lock. Release calls already hold it;
  # their run-specific groups must not wait for their own caller's lock.
  group: ${{ github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository) && format('fsharp-viewengine-production-{0}-{1}', github.run_id, inputs.preview-only) || 'fsharp-viewengine-delivery' }}
  queue: max
  cancel-in-progress: false

jobs:

  candidate:
    name: Pin accepted Docs candidate
    if: github.repository == 'meiermade/FSharp.ViewEngine' && github.workflow_ref == format('{0}/.github/workflows/deploy-production-docs.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      commit: ${{ steps.transaction.outputs.commit }}
      image: ${{ steps.transaction.outputs.image }}
      docsCoreVersion: ${{ steps.transaction.outputs.docsCoreVersion }}
      docsCliVersion: ${{ steps.transaction.outputs.docsCliVersion }}
      promoteDocs: ${{ steps.transaction.outputs.promoteDocs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore release tooling
        working-directory: ./sln
        run: |
          dotnet tool restore
          dotnet paket install
          dotnet restore src/Build/Build.fsproj
      - name: Authenticate Pulumi
        uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Setup Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
        with:
          pulumi-version: 3.261.0
      - name: Resolve or reuse the release transaction
        id: transaction
        working-directory: ./sln
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SELECTION: docs
          RELEASE_PLAN_PATH: ${{ runner.temp }}/transaction/transaction.json
        run: ./fake.sh ResolveReleaseTransaction --single-target
      - name: Pin the accepted Docs transaction
        if: steps.transaction.outputs.newPlan == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/transaction/transaction.json
          if-no-files-found: error

  preview:
    name: Preview production Docs
    needs: candidate
    if: ${{ !cancelled() && github.repository == 'meiermade/FSharp.ViewEngine' && github.ref == 'refs/heads/main' && (inputs.preview-only || needs.candidate.result == 'success') }}
    env:
      DEPLOY_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
      RELEASE_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
      CORE_PACKAGE_VERSION: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) }}
      CLI_PACKAGE_VERSION: ${{ (inputs.cli-version || needs.candidate.outputs.docsCliVersion) }}
      PROMOTE_DOCS: ${{ inputs.preview-only && format('{0}', inputs.promote-docs) || needs.candidate.outputs.promoteDocs }}
      ALLOW_UNRELEASED_PACKAGE_SNAPSHOT: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) == 'unreleased' || (inputs.cli-version || needs.candidate.outputs.docsCliVersion) == 'unreleased' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # Match the infrastructure revision used by the production deployment job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pulumi/package-lock.json
      - name: Install GKE auth plugin
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Install Pulumi packages
        run: npm ci
        working-directory: ./pulumi
      - name: Setup dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore release tooling
        working-directory: ./sln
        run: |
          dotnet tool restore
          dotnet paket install
          dotnet restore src/Build/Build.fsproj
      - name: Download pinned transaction
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/transaction
      - name: Authenticate Pulumi
        uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Setup Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
        with:
          pulumi-version: 3.261.0
      - name: Read current production identity
        working-directory: ./pulumi
        run: pulumi stack output --json --stack meiermade/fsharp-view-engine/prod > "$RUNNER_TEMP/production-preview-state.json"
      - name: Summarize pinned release for approval
        working-directory: ./sln
        env:
          RELEASE_PLAN_PATH: ${{ runner.temp }}/transaction/transaction.json
          PRODUCTION_STATE_PATH: ${{ runner.temp }}/production-preview-state.json
        run: ./fake.sh WriteReleasePreviewSummary --single-target
      - name: Preview actual production changes
        if: env.PROMOTE_DOCS == 'true'
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          work-dir: ./pulumi
          command: preview
          stack-name: meiermade/fsharp-view-engine/prod
          diff: true
          comment-on-summary: true

  acceptance:
    name: Verify accepted staging Docs
    needs: candidate
    if: needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E packages
        run: npm ci
        working-directory: ./e2e
      - name: Verify intentional browser selection
        run: npm run test:selection
        working-directory: ./e2e
        env:
          CF_ACCESS_CLIENT_ID: selection-must-not-inherit-client
          CF_ACCESS_CLIENT_SECRET: selection-must-not-inherit-secret
      - name: Authenticate Pulumi
        uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Setup Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
        with:
          pulumi-version: 3.261.0
      - name: Run protected staging smoke without retries
        working-directory: ./e2e
        env:
          EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
          EXPECTED_IMAGE: ${{ needs.candidate.outputs.image }}
        run: >-
          pulumi env run meiermade/fsharpviewengine/e2e-dev --
          bash scripts/test-release-smoke.sh
      - name: Upload credential-free release acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsharp-viewengine-release-smoke
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy accepted production Docs
    needs: [candidate, preview, acceptance]
    if: ${{ !cancelled() && github.repository == 'meiermade/FSharp.ViewEngine' && github.ref == 'refs/heads/main' && !inputs.preview-only && ((github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository) && inputs.promote-docs) || (needs.candidate.result == 'success' && needs.preview.result == 'success' && needs.acceptance.result == 'success')) }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository) && 'production' || 'release' }}
      url: https://fve.meiermade.com
    permissions:
      contents: read
      id-token: write
    steps:
      # Infrastructure follows the workflow revision, not an older accepted image's source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pulumi/package-lock.json
            e2e/package-lock.json
      - name: Install GKE auth plugin
        timeout-minutes: 10
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Install Pulumi packages
        timeout-minutes: 5
        run: npm ci
        working-directory: ./pulumi
      - name: Install E2E packages
        timeout-minutes: 5
        run: npm ci
        working-directory: ./e2e
      - name: Authenticate Pulumi
        timeout-minutes: 5
        uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Setup Pulumi CLI
        timeout-minutes: 5
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
        with:
          pulumi-version: 3.261.0
      - name: Promote exact accepted image
        id: deploy
        timeout-minutes: 20
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        env:
          DEPLOY_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
          RELEASE_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
          CORE_PACKAGE_VERSION: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) }}
          CLI_PACKAGE_VERSION: ${{ (inputs.cli-version || needs.candidate.outputs.docsCliVersion) }}
          ALLOW_UNRELEASED_PACKAGE_SNAPSHOT: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) == 'unreleased' || (inputs.cli-version || needs.candidate.outputs.docsCliVersion) == 'unreleased' }}
        with:
          work-dir: ./pulumi
          command: up
          stack-name: meiermade/fsharp-view-engine/prod
      - name: Verify production stack outputs
        timeout-minutes: 2
        env:
          EXPECTED_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
          EXPECTED_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
          EXPECTED_CORE_VERSION: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) }}
          EXPECTED_CLI_VERSION: ${{ (inputs.cli-version || needs.candidate.outputs.docsCliVersion) }}
          DEPLOYED_COMMIT: ${{ steps.deploy.outputs.releaseCommit }}
          DEPLOYED_IMAGE: ${{ steps.deploy.outputs.imageDigest }}
          DEPLOYED_ORIGIN: ${{ steps.deploy.outputs.origin }}
          DEPLOYED_CORE_VERSION: ${{ steps.deploy.outputs.coreVersion }}
          DEPLOYED_CLI_VERSION: ${{ steps.deploy.outputs.cliVersion }}
        run: |
          test "$DEPLOYED_COMMIT" = "$EXPECTED_COMMIT"
          test "$DEPLOYED_IMAGE" = "$EXPECTED_IMAGE"
          test "$DEPLOYED_ORIGIN" = 'https://fve.meiermade.com'
          test "$DEPLOYED_CORE_VERSION" = "$EXPECTED_CORE_VERSION"
          test "$DEPLOYED_CLI_VERSION" = "$EXPECTED_CLI_VERSION"
      - name: Test canonical public production release
        id: smoke
        timeout-minutes: 10
        working-directory: ./e2e
        env:
          DOCS_E2E_BASE_URL: https://fve.meiermade.com
          DOCS_EXPECTED_ENVIRONMENT: production
          DOCS_EXPECTED_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
          DOCS_EXPECTED_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
          EXPECTED_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
          EXPECTED_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
          CORE_PACKAGE_VERSION: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) }}
          CLI_PACKAGE_VERSION: ${{ (inputs.cli-version || needs.candidate.outputs.docsCliVersion) }}
        run: bash scripts/test-release-smoke.sh
      - name: Upload production E2E diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsharp-viewengine-production-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
