name: Deploy production Docs
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      preview-only:
        description: Preview the pinned release before its publishing approval
        required: true
        type: boolean
      commit:
        description: Accepted source commit
        required: true
        type: string
      image:
        description: Accepted immutable image
        required: true
        type: string
      core-version:
        description: Advertised Core version
        required: true
        type: string
      cli-version:
        description: Advertised CLI version
        required: true
        type: string
      promote-docs:
        description: Whether this release includes a Docs deployment
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  # Manual deployments own the delivery lock. Release calls already hold it;
  # their run-specific groups must not wait for their own caller's lock.
  group: ${{ github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository) && format('fsharp-viewengine-production-{0}-{1}', github.run_id, inputs.preview-only) || 'fsharp-viewengine-delivery' }}
  queue: max
  cancel-in-progress: false

jobs:

  candidate:
    name: Pin accepted Docs candidate
    if: github.repository == 'meiermade/FSharp.ViewEngine' && github.workflow_ref == format('{0}/.github/workflows/deploy-production-docs.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      commit: ${{ steps.transaction.outputs.commit }}
      image: ${{ steps.transaction.outputs.image }}
      docsCoreVersion: ${{ steps.transaction.outputs.docsCoreVersion }}
      docsCliVersion: ${{ steps.transaction.outputs.docsCliVersion }}
      promoteDocs: ${{ steps.transaction.outputs.promoteDocs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore release tooling
        working-directory: ./sln
        run: |
          dotnet tool restore
          dotnet paket install
          dotnet restore src/Build/Build.fsproj
      - name: Authenticate Pulumi
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Setup Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
        with:
          pulumi-version: 3.261.0
      - name: Resolve or reuse the release transaction
        id: transaction
        working-directory: ./sln
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SELECTION: docs
          RELEASE_PLAN_PATH: ${{ runner.temp }}/transaction/transaction.json
        run: ./fake.sh ResolveReleaseTransaction --single-target
      - name: Pin the accepted Docs transaction
        if: steps.transaction.outputs.newPlan == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/transaction/transaction.json
          if-no-files-found: error

  preview:
    name: Preview production Docs
    needs: candidate
    if: ${{ !cancelled() && github.repository == 'meiermade/FSharp.ViewEngine' && github.ref == 'refs/heads/main' && (inputs.preview-only || needs.candidate.result == 'success') }}
    env:
      DEPLOY_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
      RELEASE_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
      CORE_PACKAGE_VERSION: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) }}
      CLI_PACKAGE_VERSION: ${{ (inputs.cli-version || needs.candidate.outputs.docsCliVersion) }}
      PROMOTE_DOCS: ${{ inputs.preview-only && format('{0}', inputs.promote-docs) || needs.candidate.outputs.promoteDocs }}
      ALLOW_UNRELEASED_PACKAGE_SNAPSHOT: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) == 'unreleased' || (inputs.cli-version || needs.candidate.outputs.docsCliVersion) == 'unreleased' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # Match the infrastructure revision used by the production deployment job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pulumi/package-lock.json
      - name: Install GKE auth plugin
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Install Pulumi packages
        run: npm ci
        working-directory: ./pulumi
      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore release tooling
        working-directory: ./sln
        run: |
          dotnet tool restore
          dotnet paket install
          dotnet restore src/Build/Build.fsproj
      - name: Download pinned transaction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/transaction
      - name: Authenticate Pulumi
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Setup Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
        with:
          pulumi-version: 3.261.0
      - name: Read current production identity
        working-directory: ./pulumi
        run: pulumi stack output --json --stack meiermade/fsharp-view-engine/prod > "$RUNNER_TEMP/production-preview-state.json"
      - name: Summarize pinned release for approval
        working-directory: ./sln
        env:
          RELEASE_PLAN_PATH: ${{ runner.temp }}/transaction/transaction.json
          PRODUCTION_STATE_PATH: ${{ runner.temp }}/production-preview-state.json
        run: ./fake.sh WriteReleasePreviewSummary --single-target
      - name: Preview actual production changes
        if: env.PROMOTE_DOCS == 'true'
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          work-dir: ./pulumi
          command: preview
          stack-name: meiermade/fsharp-view-engine/prod
          diff: true
          comment-on-summary: true
          # Pulumi encrypts saved-plan secrets with the stack's secrets provider.
          plan: ${{ runner.temp }}/production-plan.json
      - name: Retain reviewed production plan
        if: env.PROMOTE_DOCS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/production-plan.json
          if-no-files-found: error
          overwrite: true

  acceptance:
    name: Verify accepted staging Docs
    needs: candidate
    if: needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E packages
        run: npm ci
        working-directory: ./e2e
      - name: Verify intentional browser selection
        run: npm run test:selection
        working-directory: ./e2e
        env:
          CF_ACCESS_CLIENT_ID: selection-must-not-inherit-client
          CF_ACCESS_CLIENT_SECRET: selection-must-not-inherit-secret
      - name: Authenticate Pulumi
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Setup Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
        with:
          pulumi-version: 3.261.0
      - name: Run protected staging smoke without retries
        working-directory: ./e2e
        env:
          EXPECTED_COMMIT: ${{ needs.candidate.outputs.commit }}
          EXPECTED_IMAGE: ${{ needs.candidate.outputs.image }}
        run: >-
          pulumi env run meiermade/fsharpviewengine/e2e-dev --
          bash scripts/test-release-smoke.sh
      - name: Upload credential-free release acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsharp-viewengine-release-smoke
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy accepted production Docs
    needs: [candidate, preview, acceptance]
    if: ${{ always() && github.repository == 'meiermade/FSharp.ViewEngine' && github.ref == 'refs/heads/main' && !inputs.preview-only && ((github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository) && inputs.promote-docs) || (needs.candidate.result == 'success' && needs.preview.result == 'success' && needs.acceptance.result == 'success')) }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository) && 'production' || 'release' }}
      url: https://fve.meiermade.com
    permissions:
      contents: read
      id-token: write
    # Bound individual operations so failure and cancellation recovery can still run.
    steps:
      # Infrastructure follows the workflow revision, not an older accepted image's source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pulumi/package-lock.json
            e2e/package-lock.json
      - name: Install GKE auth plugin
        timeout-minutes: 10
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Install Pulumi packages
        timeout-minutes: 5
        run: npm ci
        working-directory: ./pulumi
      - name: Install E2E packages
        timeout-minutes: 5
        run: npm ci
        working-directory: ./e2e
      - name: Authenticate Pulumi
        timeout-minutes: 5
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Setup Pulumi CLI
        timeout-minutes: 5
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
        with:
          pulumi-version: 3.261.0
      - name: Download reviewed production plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-production
      - name: Record previous healthy production release
        id: previous
        timeout-minutes: 3
        working-directory: ./pulumi
        env:
          LEGACY_PRODUCTION_COMMIT: d78cdbdee50bb6940b4e40b18350714e40151fea
          LEGACY_PRODUCTION_CORE_VERSION: 2026.8.2
          LEGACY_PRODUCTION_CLI_VERSION: unreleased
        run: |
          pulumi stack export --stack meiermade/fsharp-view-engine/prod > "$RUNNER_TEMP/production-state.json"
          image="$(jq -r '[.deployment.resources[] | select(.type == "kubernetes:apps/v1:Deployment" and .outputs.metadata.name == "fsharpviewengine") | .outputs.spec.template.spec.containers[0].image][0] // empty' "$RUNNER_TEMP/production-state.json")"
          commit="$(jq -r '[.deployment.resources[] | select(.type == "kubernetes:apps/v1:Deployment" and .outputs.metadata.name == "fsharpviewengine") | .outputs.spec.template.spec.containers[0].env[] | select(.name == "RELEASE_COMMIT") | .value][0] // empty' "$RUNNER_TEMP/production-state.json")"
          core="$(pulumi stack output coreVersion --stack meiermade/fsharp-view-engine/prod 2>/dev/null || true)"
          cli="$(pulumi stack output cliVersion --stack meiermade/fsharp-view-engine/prod 2>/dev/null || true)"
          test -n "$image"
          test -n "$commit"
          cli="${cli:-$LEGACY_PRODUCTION_CLI_VERSION}"
          if [[ -z "$core" ]]; then
            test "$commit" = "$LEGACY_PRODUCTION_COMMIT"
            core="$LEGACY_PRODUCTION_CORE_VERSION"
          fi
          test -n "$core"
          test -n "$cli"
          {
            echo "image=$image"
            echo "commit=$commit"
            echo "core=$core"
            echo "cli=$cli"
          } >> "$GITHUB_OUTPUT"
      - name: Promote exact accepted image
        id: deploy
        timeout-minutes: 20
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        env:
          DEPLOY_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
          RELEASE_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
          CORE_PACKAGE_VERSION: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) }}
          CLI_PACKAGE_VERSION: ${{ (inputs.cli-version || needs.candidate.outputs.docsCliVersion) }}
          ALLOW_UNRELEASED_PACKAGE_SNAPSHOT: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) == 'unreleased' || (inputs.cli-version || needs.candidate.outputs.docsCliVersion) == 'unreleased' }}
        with:
          work-dir: ./pulumi
          command: up
          stack-name: meiermade/fsharp-view-engine/prod
          plan: ${{ runner.temp }}/reviewed-production/production-plan.json
      - name: Verify production stack outputs
        timeout-minutes: 2
        env:
          EXPECTED_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
          EXPECTED_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
          EXPECTED_CORE_VERSION: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) }}
          EXPECTED_CLI_VERSION: ${{ (inputs.cli-version || needs.candidate.outputs.docsCliVersion) }}
          DEPLOYED_COMMIT: ${{ steps.deploy.outputs.releaseCommit }}
          DEPLOYED_IMAGE: ${{ steps.deploy.outputs.imageDigest }}
          DEPLOYED_ORIGIN: ${{ steps.deploy.outputs.origin }}
          DEPLOYED_CORE_VERSION: ${{ steps.deploy.outputs.coreVersion }}
          DEPLOYED_CLI_VERSION: ${{ steps.deploy.outputs.cliVersion }}
        run: |
          test "$DEPLOYED_COMMIT" = "$EXPECTED_COMMIT"
          test "$DEPLOYED_IMAGE" = "$EXPECTED_IMAGE"
          test "$DEPLOYED_ORIGIN" = 'https://fve.meiermade.com'
          test "$DEPLOYED_CORE_VERSION" = "$EXPECTED_CORE_VERSION"
          test "$DEPLOYED_CLI_VERSION" = "$EXPECTED_CLI_VERSION"
      - name: Test canonical public production release
        id: smoke
        timeout-minutes: 10
        working-directory: ./e2e
        env:
          DOCS_E2E_BASE_URL: https://fve.meiermade.com
          DOCS_EXPECTED_ENVIRONMENT: production
          DOCS_EXPECTED_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
          DOCS_EXPECTED_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
          EXPECTED_COMMIT: ${{ (inputs.commit || needs.candidate.outputs.commit) }}
          EXPECTED_IMAGE: ${{ (inputs.image || needs.candidate.outputs.image) }}
          CORE_PACKAGE_VERSION: ${{ (inputs.core-version || needs.candidate.outputs.docsCoreVersion) }}
          CLI_PACKAGE_VERSION: ${{ (inputs.cli-version || needs.candidate.outputs.docsCliVersion) }}
        run: bash scripts/test-release-smoke.sh
      - name: Upload production E2E diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsharp-viewengine-production-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
      - name: Restore previous production release after unsuccessful acceptance
        id: restore
        if: ${{ (failure() || cancelled()) && steps.deploy.outcome != 'skipped' && steps.previous.outputs.image != '' && steps.previous.outputs.commit != '' }}
        timeout-minutes: 20
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        env:
          DEPLOY_IMAGE: ${{ steps.previous.outputs.image }}
          RELEASE_COMMIT: ${{ steps.previous.outputs.commit }}
          CORE_PACKAGE_VERSION: ${{ steps.previous.outputs.core }}
          CLI_PACKAGE_VERSION: ${{ steps.previous.outputs.cli }}
          ALLOW_UNRELEASED_PACKAGE_SNAPSHOT: ${{ steps.previous.outputs.core == 'unreleased' || steps.previous.outputs.cli == 'unreleased' }}
        with:
          work-dir: ./pulumi
          command: up
          stack-name: meiermade/fsharp-view-engine/prod
      - name: Confirm restored production release is healthy
        if: ${{ (failure() || cancelled()) && steps.restore.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: ./pulumi
        env:
          EXPECTED_IMAGE: ${{ steps.previous.outputs.image }}
          EXPECTED_COMMIT: ${{ steps.previous.outputs.commit }}
          EXPECTED_CORE_VERSION: ${{ steps.previous.outputs.core }}
          EXPECTED_CLI_VERSION: ${{ steps.previous.outputs.cli }}
        run: |
          test "$(pulumi stack output imageDigest --stack meiermade/fsharp-view-engine/prod)" = "$EXPECTED_IMAGE"
          test "$(pulumi stack output releaseCommit --stack meiermade/fsharp-view-engine/prod)" = "$EXPECTED_COMMIT"
          test "$(pulumi stack output coreVersion --stack meiermade/fsharp-view-engine/prod)" = "$EXPECTED_CORE_VERSION"
          test "$(pulumi stack output cliVersion --stack meiermade/fsharp-view-engine/prod)" = "$EXPECTED_CLI_VERSION"
          test "$(pulumi stack output origin --stack meiermade/fsharp-view-engine/prod)" = 'https://fve.meiermade.com'
          curl --fail --silent --show-error --max-time 30 'https://fve.meiermade.com/health' >/dev/null
