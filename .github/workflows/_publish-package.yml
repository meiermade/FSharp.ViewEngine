name: Publish package
on:
  workflow_call:
    inputs:
      packageId:
        description: NuGet package ID
        required: true
        type: string
      version:
        description: Package calendar version (YYYY.M.MINOR)
        required: true
        type: string
      minimumCoreVersion:
        description: Minimum published FSharp.ViewEngine version required by Docs
        required: false
        type: string
      markLatest:
        description: Whether this package release becomes the repository-wide Latest release
        required: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.packageId }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify ${{ inputs.packageId }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      previousTag: ${{ steps.release.outputs.previousTag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet paket install
          dotnet restore FSharp.ViewEngine.slnx
        working-directory: ./sln
      - name: Prepare package release
        env:
          PACKAGE_ID: ${{ inputs.packageId }}
          PACKAGE_VERSION: ${{ inputs.version }}
          DOCS_MINIMUM_CORE_VERSION: ${{ inputs.minimumCoreVersion }}
          MARK_LATEST: ${{ inputs.markLatest }}
          RELEASE_METADATA_PATH: ${{ runner.temp }}/release-metadata.json
        run: ./fake.sh PrepareRelease --single-target
        working-directory: ./sln
      - name: Read release metadata
        id: release
        env:
          RELEASE_METADATA_PATH: ${{ runner.temp }}/release-metadata.json
        run: ./fake.sh ReadReleaseMetadata --single-target
        working-directory: ./sln
      - name: Build, test, pack, and verify selected package
        env:
          PACKAGE_ID: ${{ inputs.packageId }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          DOCS_MINIMUM_CORE_VERSION: ${{ inputs.minimumCoreVersion }}
        run: ./fake.sh VerifyPackage
        working-directory: ./sln
      - name: Record package checksums
        run: ./fake.sh RecordPackageChecksums --single-target
        working-directory: ./sln
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.packageId }}-${{ steps.release.outputs.version }}
          path: |
            nugets/*.nupkg
            nugets/*.snupkg
            nugets/SHA256SUMS
            ${{ runner.temp }}/release-metadata.json
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.packageId }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.packageId }}-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/package
      - name: Restore build tooling
        run: |
          dotnet tool restore
          dotnet paket install
          dotnet restore src/Build/Build.fsproj
        working-directory: ./sln
      - name: Authenticate to NuGet with GitHub OIDC
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish and reconcile package release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_DIRECTORY: ${{ runner.temp }}/package
          PACKAGE_ID: ${{ inputs.packageId }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          DOCS_MINIMUM_CORE_VERSION: ${{ inputs.minimumCoreVersion }}
          MARK_LATEST: ${{ inputs.markLatest }}
          RELEASE_METADATA_PATH: ${{ runner.temp }}/package/release-metadata.json
        run: ./fake.sh PublishPackageRelease --single-target
        working-directory: ./sln
