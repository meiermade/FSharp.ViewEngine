name: Publish packages
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to publish
        required: true
        default: core
        type: choice
        options:
          - core
          - docs
          - both
      coreVersion:
        description: FSharp.ViewEngine version; required for core or both
        required: false
        type: string
      docsVersion:
        description: FSharp.ViewEngine.Docs version; required for docs or both
        required: false
        type: string
      minimumCoreVersion:
        description: Minimum Core version for FSharp.ViewEngine.Docs; required for docs or both
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/_publish-package.yml
    with:
      packages: ${{ inputs.packages }}
      coreVersion: ${{ inputs.coreVersion }}
      docsVersion: ${{ inputs.docsVersion }}
      minimumCoreVersion: ${{ inputs.minimumCoreVersion }}
    secrets: inherit
