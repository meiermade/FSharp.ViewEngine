name: Publish FSharp.ViewEngine
on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional Core calendar version override (YYYY.M.MINOR)
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/_publish-package.yml
    with:
      packageId: FSharp.ViewEngine
      tagPrefix: v
      version: ${{ inputs.version }}
    secrets: inherit
