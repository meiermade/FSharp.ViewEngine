name: Publish FSharp.ViewEngine
on:
  workflow_dispatch:
    inputs:
      version:
        description: Core calendar version (YYYY.M.MINOR)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/_publish-package.yml
    with:
      packageId: FSharp.ViewEngine
      tagPrefix: v
      version: ${{ inputs.version }}
    secrets: inherit
