name: Preview
on:
  pull_request:
    branches:
      - main
jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install Tools
        run: dotnet tool restore
        working-directory: ./sln
      - name: Install Packages
        run: |
          dotnet paket install
          dotnet restore FSharp.ViewEngine.slnx
        working-directory: ./sln
      - name: Build solution
        run: dotnet build FSharp.ViewEngine.slnx --configuration Release --no-restore
        working-directory: ./sln
      - name: Test
        run: ./fake.sh Test
        working-directory: ./sln
      - name: Pack
        run: |
          dotnet pack src/FSharp.ViewEngine/FSharp.ViewEngine.fsproj --configuration Release --no-restore --output "$RUNNER_TEMP/package" /p:PackageVersion=0.0.0-preview
          dotnet pack src/FSharp.ViewEngine.Docs/FSharp.ViewEngine.Docs.fsproj --configuration Release --no-restore --output "$RUNNER_TEMP/package" /p:PackageVersion=0.0.0-preview
        working-directory: ./sln
      - name: Verify package compatibility
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/package
        run: ./fake.sh VerifyPackage --single-target
        working-directory: ./sln

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E packages
        run: npm ci
        working-directory: ./e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ./e2e
      - name: Test production Docs image
        run: npm test
        working-directory: ./e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fsharp-viewengine-preview-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
            /tmp/fsharp-viewengine-e2e
          if-no-files-found: ignore

  preview:
    # Keep this terminal job named Test because it is the protected branch check.
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    needs:
      - unit
      - e2e
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Install Packages
        run: npm ci
        working-directory: ./pulumi
      - name: Authenticate Pulumi
        uses: pulumi/auth-actions@v1
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Preview
        uses: pulumi/actions@v6
        env:
          RELEASE_VERSION: preview
          RELEASE_COMMIT: ${{ github.event.pull_request.head.sha }}
        with:
          work-dir: ./pulumi
          command: preview
          stack-name: prod
          diff: true
          comment-on-pr: true
