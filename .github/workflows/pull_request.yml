name: Pull Request
on:
  pull_request:
    paths-ignore:
      - '**.md'
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install Tools
        run: dotnet tool restore
        working-directory: ./lib
      - name: Install Packages
        run: dotnet paket install
        working-directory: ./lib
      - name: Test
        run: ./fake.sh Test
        working-directory: ./lib
  preview:
    name: Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs:
      - test
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Packages
        run: npm install
        working-directory: ./pulumi
      - name: Preview
        uses: pulumi/actions@v6
        with:
          work-dir: ./pulumi
          command: preview
          stack-name: prod
          diff: true
          comment-on-pr: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_TOKEN }}
