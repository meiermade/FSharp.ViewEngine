paths:
  .github/workflows/deploy-staging-docs.yml:
    # GitHub added concurrency.queue in May 2026; actionlint 1.7.12 has not added it yet.
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/release.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/deploy-production-docs.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
